schema_version: 1

context:
  name: pydivert
  version: "4.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/pydivert-${{ version }}.tar.gz
  sha256: 06272d935efe7489cba5558bf6f7de5b68a2fdbd9fa0521ee04120b22fdeb73a

build:
  number: 0
  skip: not win and not linux
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - hatchling
    - python
  run:
    - python

tests:
  - python:
      imports:
        - pydivert
      pip_check: true

about:
  summary: Python binding to windivert driver
  license: LGPL-3.0-or-later or GPL-2.0-or-later
  license_file:
    - LICENSE
    - LICENSE-LGPL-3.0-or-later
    - LICENSE-GPL-2.0-or-later
  homepage: https://github.com/ffalcinelli/pydivert
  documentation: https://pythonhosted.org/pydivert/

extra:
  recipe-maintainers:
    - jonashaag
    - freundTech
