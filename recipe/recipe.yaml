schema_version: 1

context:
  name: pydivert
  version: "4.0.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/pydivert-${{ version }}.tar.gz
  sha256: 7de2eab52bef9005bcdb9d1ea3641b9a42bc8be8093af748d33c635d997dced2

build:
  number: 0
  skip: not win
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - hatchling
    - python
  run:
    - python

tests:
  - python:
      imports:
        - pydivert
      pip_check: true

about:
  summary: Python binding to windivert driver
  license: LGPL-3.0-or-later or GPL-2.0-or-later
  license_file:
    - LICENSE
    - LICENSE-LGPL-3.0-or-later
    - LICENSE-GPL-2.0-or-later
  homepage: https://github.com/ffalcinelli/pydivert
  documentation: https://pythonhosted.org/pydivert/

extra:
  recipe-maintainers:
    - freundTech

